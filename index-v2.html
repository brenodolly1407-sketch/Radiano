const BASE_QUESTIONS = [

    enunciado: String.raw`<p>Seja $i$ a unidade imaginária ($i^2=-1$). O valor da soma</p>

    resolucao: String.raw`<p><strong>Ideia:</strong> as potências de $i$ têm período 4: $i^1=i,\; i^2=-1,\; i^3=-i,\; i^4=1$ e $i^{k+4}=i^k$.</p>

    enunciado: String.raw`<p>Se $x>0$ satisfaz a equação</p>
      $$\log_2 x + \log_4 x + \log_{16} x = 7,$$
      <p>então o valor de $x$ é:</p>`,

      C: String.raw`$16$`,

const EMAIL_RE  = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
const HANDLE_RE = /^[a-z0-9_]{3,20}$/;

function ago(ts) {
  const m = Math.max(0, Math.round((Date.now() - ts) / 60000));
  if (m < 1) return 'agora';
  if (m < 60) return `há ${m} min`;
  const h = Math.round(m / 60);
  if (h < 24) return `há ${h} h`;
  return `há ${Math.round(h / 24)} d`;
}

const AV = ['bg-indigo-500', 'bg-emerald-500', 'bg-rose-500', 'bg-amber-500', 'bg-sky-500', 'bg-violet-500', 'bg-teal-500', 'bg-pink-500'];
function avatar(name, size = 'h-10 w-10 text-base') {
  const s = String(name || '?'); let h = 0;
  for (const ch of s) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return `<span class="${size} shrink-0 rounded-full grid place-items-center font-bold text-white ${AV[h % AV.length]}">${esc(s.trim().charAt(0).toUpperCase() || '?')}</span>`;
}

function suggestHandle(name, taken) {
  let base = (name || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase()
    .replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 14);
  if (base.length < 3) base = (base + 'aluno').slice(0, 8);
  let h = base;
  while (taken(h) || !HANDLE_RE.test(h)) h = base + Math.floor(Math.random() * 900 + 100);
  return h;
}
function makeCode(seed, taken) {
  const letters = (seed || '').toUpperCase().replace(/[^A-Z]/g, '').padEnd(3, 'X').slice(0, 3);
  let c;
  do { c = '#' + letters + (Math.floor(Math.random() * 900) + 100); } while (taken(c));
  return c;
}

const lsDel = k => { try { localStorage.removeItem(k); } catch (e) {} delete mem[k]; };

function normalizeHtmlBlock(txt) {
  const s = String(txt || '').trim();
  if (!s) return '';
  if (/^\s*<(p|div|ul|ol|blockquote|pre|h[1-6])\b/i.test(s)) return s;
  return s.split(/\n\s*\n/).map(p => `<p>${p.trim().replace(/\n/g, '<br>')}</p>`).join('');
}

function nextQuestionId() {
  const maxId = QUESTIONS.reduce((m, q) => Math.max(m, Number(q.id) || 0), 0);
  return maxId + 1;
}

function sanitizeQuestion(raw, fallbackId, inheritedMeta = {}) {
  if (!raw || typeof raw !== 'object') return { error: 'Objeto de questão inválido.' };

  const meta = (raw.prova && typeof raw.prova === 'object') ? raw.prova : {};
  const banca = String(
    raw.banca ?? raw.concurso ?? raw.orgao ?? raw.órgão ??
    meta.banca ?? meta.concurso ?? meta.orgao ?? meta.órgão ??
    inheritedMeta.banca ?? ''
  ).trim();

  const anoRaw = raw.ano ?? meta.ano ?? inheritedMeta.ano ?? new Date().getFullYear();
  const ano = Number(anoRaw) || new Date().getFullYear();

  const materia = String(
    raw.materia ?? raw.matéria ?? raw.disciplina ??
    meta.materia ?? meta.matéria ?? meta.disciplina ??
    inheritedMeta.materia ?? ''
  ).trim();

  const fase = String(raw.fase ?? meta.fase ?? inheritedMeta.fase ?? '').trim();
  const assuntoBase = String(raw.assunto ?? raw.topico ?? raw.tópico ?? 'Geral').trim() || 'Geral';
  const assunto = fase && !assuntoBase.toLowerCase().includes(fase.toLowerCase())
    ? `${assuntoBase} (${fase})`
    : assuntoBase;

  const rawEnun = raw.enunciado ?? raw.pergunta ?? raw.texto ?? '';
  const enunciado = normalizeHtmlBlock(rawEnun);
  const imagem = typeof raw.imagem === 'string' ? raw.imagem.trim() : '';
  const imagemPos = raw.imagemPos === 'resolucao' ? 'resolucao' : 'enunciado';

  const alts = {};
  const srcAlts = raw.alternativas ?? raw.opcoes ?? raw.opções ?? {};
  if (Array.isArray(srcAlts)) {
    srcAlts.forEach((val, idx) => {
      const l = LETTERS[idx];
      if (l && val !== undefined && String(val).trim() !== '') {
        alts[l] = String(val).trim();
      }
    });
  } else if (srcAlts && typeof srcAlts === 'object') {
    for (const l of LETTERS) {
      const val = srcAlts[l] ?? srcAlts[l.toLowerCase()] ?? raw['alt_' + l.toLowerCase()] ?? raw[l];
      if (val !== undefined && String(val).trim() !== '') alts[l] = String(val).trim();
    }
  } else {
    for (const l of LETTERS) {
      const val = raw['alt_' + l.toLowerCase()] ?? raw[l];
      if (val !== undefined && String(val).trim() !== '') alts[l] = String(val).trim();
    }
  }

  let gabarito = String(
    raw.gabarito ?? raw.resposta ?? raw.correta ?? raw.alternativa_correta ?? ''
  ).trim().toUpperCase();
  const gLetterMatch = gabarito.match(/\b([A-E])\b/);
  if (gLetterMatch) gabarito = gLetterMatch[1];

  const rawResolucao = raw.resolucao ?? raw.resolução ?? raw.comentario ?? raw.comentário ?? raw.explicacao ?? raw.explicação ?? '<p>Resolução não informada.</p>';
  const resolucao = normalizeHtmlBlock(rawResolucao);

  if (!banca) return { error: 'Faltou informar a BANCA.' };
  if (!materia) return { error: 'Faltou informar a MATÉRIA.' };
  if (!String(rawEnun || '').trim() && !imagem) return { error: 'Informe o ENUNCIADO ou uma imagem.' };
  if (Object.keys(alts).length < 2) return { error: 'Informe ao menos 2 alternativas (A–E).' };
  if (!LETTERS.includes(gabarito) || !alts[gabarito]) return { error: `Gabarito "${gabarito || '?'}" inválido ou sem alternativa correspondente.` };

  const rawId = raw.id ?? raw.numero ?? raw.número;
  const id = (rawId !== undefined && rawId !== null && String(rawId).trim() !== '') ? rawId : fallbackId;

  return {
    question: { id, banca, ano, materia, assunto, enunciado, imagem, imagemPos, alternativas: alts, gabarito, resolucao, custom: true }
  };
}

  BASE_QUESTIONS.forEach(q => {

  if (Array.isArray(saved)) {
    let nextId = BASE_QUESTIONS.reduce((m, q) => Math.max(m, Number(q.id) || 0), 0) + 1;
    saved.forEach(item => {
      const check = sanitizeQuestion(item, nextId);
      if (check.question) {
        if (map.has(String(check.question.id))) check.question.id = nextId;
        nextId = Math.max(nextId + 1, (Number(check.question.id) || 0) + 1);
        const qObj = { ...check.question, custom: true };
        if (!deletedQuestionIds.has(String(qObj.id))) {
          customQuestions.push(qObj);
          map.set(String(qObj.id), qObj);
        }
      }
    });
  }
  QUESTIONS = Array.from(map.values());
}

function addQuestionsToBank(newList) {
  if (!Array.isArray(newList) || !newList.length) return 0;
  let nextId = nextQuestionId();
  const existingIds = new Set([
    ...QUESTIONS.map(q => String(q.id)),
    ...customQuestions.map(q => String(q.id)),
    ...BASE_QUESTIONS.map(q => String(q.id))
  ]);
  const added = [];

  newList.forEach(q => {
    const item = { ...q, custom: true };
    if (!item.id || existingIds.has(String(item.id))) {
      while (existingIds.has(String(nextId))) nextId++;
      item.id = nextId++;
    }
    const idStr = String(item.id);
    if (deletedQuestionIds.has(idStr)) {
      deletedQuestionIds.delete(idStr);
      lsSet(DELETED_Q_KEY, Array.from(deletedQuestionIds));
    }
    existingIds.add(idStr);
    customQuestions.push(item);
    added.push(item);
  });

  const persisted = lsSet(CUSTOM_Q_KEY, customQuestions);
  if (!persisted) {
    toast('Aviso: armazenamento cheio! Exporte o JSON para não perder questões.', 'bad');
  }
  rebuildQuestionsBank();
  return added.length;
}

async function deleteQuestionById(qid) {
  const q = getQ(qid);
  if (!q) return;
  const label = `${q.banca} ${q.ano} — ${q.materia} (${q.assunto})`;
  if (!(await askConfirm(`Excluir esta questão permanentemente?\n\n${label}`, 'Excluir'))) return;

  const idStr = String(q.id);
  const prevCustomLen = customQuestions.length;
  customQuestions = customQuestions.filter(item => String(item.id) !== idStr);

  if (customQuestions.length !== prevCustomLen) {
    lsSet(CUSTOM_Q_KEY, customQuestions);
  }
  if (BASE_QUESTIONS.some(bq => String(bq.id) === idStr)) {
    deletedQuestionIds.add(idStr);
    lsSet(DELETED_Q_KEY, Array.from(deletedQuestionIds));
  }

  delete db.progress[q.id];
  delete state.struck[q.id];
  delete state.retry[q.id];
  saveDB();

  rebuildQuestionsBank();
  applyFilters();
  updateHeader();
  render();
  renderAddQuestions();
  toast('🗑️ Questão excluída do banco', 'bad');
}

function streakValid(count, last) { return (last === todayStr() || last === yesterdayStr()) ? (count || 0) : 0; }
const currentStreak = () => streakValid(db.streak.count, db.streak.last);

function registerHitToday() {
  const s = db.streak, t = todayStr();
  if (s.last === t) return false;
  s.count = (s.last === yesterdayStr()) ? s.count + 1 : 1;
  s.last = t;
  s.best = Math.max(s.best || 0, s.count);
  return true;
}

function rankInfo(xp) {
  let idx = 0;
  RANKS.forEach((r, i) => { if (xp >= r.min) idx = i; });
  const cur = RANKS[idx], next = RANKS[idx + 1] || null;
  const pct = next ? Math.min(100, ((xp - cur.min) / (next.min - cur.min)) * 100) : 100;
  return { cur, next, pct };
}

const getQ = id => QUESTIONS.find(q => String(q.id) === String(id));

function statsFrom(progress) {
  const subjects = {}; let solved = 0, hits = 0;
  Object.entries(progress || {}).forEach(([id, p]) => {
    const q = getQ(id); if (!q) return;
    const s = subjects[q.materia] = subjects[q.materia] || { hit: 0, err: 0 };
    p.correct ? s.hit++ : s.err++;
    solved++; if (p.correct) hits++;
  });
  return { subjects, solved, hits };
}
function activityFromLog(log) {
  return (log || []).slice(-8).reverse().map(e => {
    const q = getQ(e.qid); if (!q) return null;
    return { text: `${e.correct ? 'Acertou' : 'Errou'} uma questão de ${q.materia} — ${q.assunto} (${q.banca})`, at: e.at, ok: !!e.correct };
  }).filter(Boolean);
}
const pctOf = p => (p.solved ? Math.round((p.hits / p.solved) * 100) : 0);

  return {

    xp: hit * 10 + err * 2, streak: b.streak, solved: hit + err, hits: hit, subjects: b.subjects,

async function hashPw(pw, salt) {
  try {
    if (window.crypto && crypto.subtle) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(salt + ':' + pw));
      return 'sha256:' + [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
    }
  } catch (e) {}
  return 'b64:' + btoa(unescape(encodeURIComponent(salt + ':' + pw)));
}

}

function resolveLocalProfile(id) {
  if (id.startsWith('bot:')) { const b = BOTS.find(x => x.id === id); return b ? profileFromBot(b) : null; }
  const u = AuthDemo._users()[id];
  return u ? profileFromData(u.id, u.name, u.handle, u.code, loadData(u.id)) : null;
}
function findLocalProfile(query) {
  const s = (query || '').trim().toLowerCase();
  if (!s) return null;
  const users = Object.values(AuthDemo._users());
  if (EMAIL_RE.test(s)) {
    const u = users.find(x => x.email === s);
    return u ? resolveLocalProfile(u.id) : null;
  }
  const cands = [...BOTS.map(b => profileFromBot(b)), ...users.map(u => resolveLocalProfile(u.id))];
  if (s.startsWith('#')) return cands.find(p => p.code.toLowerCase() === s) || null;
  if (s.startsWith('@')) return cands.find(p => p.handle === s.slice(1)) || null;
  return cands.find(p => p.handle === s || p.code.toLowerCase() === '#' + s) || null;
}

  if (state.assunto !== 'Todos' && !list.includes(state.assunto)) {
    list.unshift(state.assunto);

  return ['Todos', ...list];

function applyFilters() {

  if (!window.renderMathInElement || !el) return;
  try {
    renderMathInElement(el, {
      delimiters: [
        { left: '$$', right: '$$', display: true },
        { left: '\\[', right: '\\]', display: true },
        { left: '$', right: '$', display: false },
        { left: '\\(', right: '\\)', display: false }
      ],
      throwOnError: false, strict: false
    });
  } catch (e) { console.warn('KaTeX:', e); }
}

function toast(html, tone) {
  const tones = { good: 'bg-emerald-600 text-white', bad: 'bg-slate-800 text-white', fire: 'bg-orange-500 text-white', level: 'bg-violet-600 text-white' };
  const el = document.createElement('div');
  el.className = `pointer-events-auto rounded-xl px-4 py-2.5 text-sm font-semibold shadow-xl transition-all duration-300 slide-up ${tones[tone] || tones.bad}`;
  el.innerHTML = html;
  $('#toasts').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transform = 'translateY(8px)'; setTimeout(() => el.remove(), 320); }, 2800);
}

function copyText(text) {
  const done = () => toast('Copiado: ' + esc(text), 'good');
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).then(done, fallback); return; }
  } catch (e) {}
  fallback();
  function fallback() {
    try { const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); done(); }
    catch (e) { toast('Não foi possível copiar', 'bad'); }
  }
}

function splitIntoQuestionBlocks(rawText) {
  const normalized = String(rawText || '').replace(/\r\n/g, '\n').trim();
  if (!normalized) return [];

  const rawLines = normalized.split('\n');
  const blocks = [];
  let curLines = [];
  let sawAltsOrGab = false;
  let sawGabOrRes = false;

  const flush = () => {
    const txt = curLines.join('\n').trim();
    if (txt) blocks.push(txt);
    curLines = [];
    sawAltsOrGab = false;
    sawGabOrRes = false;
  };

  for (const line of rawLines) {
    const trimmed = line.trim();

    if (/^(=+|-{3,}|\*{3,}|#{3,}|\/{3,})$/.test(trimmed)) {
      flush();
      continue;
    }

    if (/\bBANCA\s*:/i.test(trimmed) && sawAltsOrGab && curLines.length > 0) {
      flush();
    }

    if (/^ENUNCIADO\s*:/i.test(trimmed) && sawGabOrRes && curLines.length > 0) {
      flush();
    }

    if (/^(A|B|C|D|E|GABARITO)\s*:/i.test(trimmed)) {
      sawAltsOrGab = true;
    }
    if (/^(GABARITO|RESOLUCAO|RESOLUÇÃO)\s*:/i.test(trimmed)) {
      sawGabOrRes = true;
    }

    curLines.push(line);
  }
  flush();

  return blocks;
}

function parseStructuredText(rawText) {
  const blocks = splitIntoQuestionBlocks(rawText);

  const valid = [];
  const errors = [];

  blocks.forEach((blk, idx) => {
    const lines = blk.split(/\r?\n/);
    let metaLine = '';
    let currentKey = null;
    const parts = { ENUNCIADO: [], A: [], B: [], C: [], D: [], E: [], GABARITO: [], RESOLUCAO: [], IMAGEM: [] };

    lines.forEach((line, lIdx) => {
      if (lIdx === 0 && /\bBANCA\s*:/i.test(line)) {
        metaLine = line;
        return;
      }
      const m = line.match(/^(ENUNCIADO|A|B|C|D|E|GABARITO|RESOLUCAO|RESOLUÇÃO|IMAGEM)\s*:\s*(.*)$/i);
      if (m) {
        let key = m[1].toUpperCase();
        if (key === 'RESOLUÇÃO') key = 'RESOLUCAO';
        currentKey = key;
        parts[currentKey].push(m[2]);
      } else if (currentKey) {
        parts[currentKey].push(line);
      }
    });

    const bancaMatch = metaLine.match(/BANCA\s*:\s*([^|]+)/i);
    const anoMatch = metaLine.match(/ANO\s*:\s*([^|]+)/i);
    const matMatch = metaLine.match(/(?:MATERIA|MATÉRIA)\s*:\s*([^|]+)/i);
    const assMatch = metaLine.match(/ASSUNTO\s*:\s*([^|]+)/i);

    const gabRaw = parts.GABARITO.join(' ').trim().toUpperCase();
    const gabMatch = gabRaw.match(/\b([A-E])\b/);
    const gabarito = gabMatch ? gabMatch[1] : gabRaw;

    const candidate = {
      banca: bancaMatch ? bancaMatch[1].trim() : '',
      ano: anoMatch ? anoMatch[1].trim() : new Date().getFullYear(),
      materia: matMatch ? matMatch[1].trim() : '',
      assunto: assMatch ? assMatch[1].trim() : 'Geral',
      enunciado: parts.ENUNCIADO.join('\n').trim(),
      imagem: parts.IMAGEM.join('').trim(),
      alternativas: {
        A: parts.A.join('\n').trim(),
        B: parts.B.join('\n').trim(),
        C: parts.C.join('\n').trim(),
        D: parts.D.join('\n').trim(),
        E: parts.E.join('\n').trim()
      },
      gabarito,
      resolucao: parts.RESOLUCAO.join('\n').trim()
    };

    const res = sanitizeQuestion(candidate, nextQuestionId() + valid.length);
    if (res.error) errors.push(`Bloco #${idx + 1}: ${res.error}`);
    else valid.push(res.question);
  });

  return { valid, errors, totalBlocks: blocks.length };
}

function parseJsonQuestions(rawJson) {
  let txt = String(rawJson || '').trim();
  if (!txt) return { valid: [], errors: ['Cole um JSON ou array JSON antes de importar.'], totalBlocks: 0 };
  let parsed;
  try {
    parsed = JSON.parse(txt);
  } catch (e) {
    try {
      const fixed = txt.replace(/\\(?![\\"/bfnrtu])/g, '\\\\');
      parsed = JSON.parse(fixed);
    } catch (e2) {
      return { valid: [], errors: ['JSON inválido: ' + e.message], totalBlocks: 0 };
    }
  }

  let arr = [];
  let inheritedMeta = {};

  if (Array.isArray(parsed)) {
    arr = parsed;
  } else if (parsed && typeof parsed === 'object') {
    const nestedList = parsed.questoes ?? parsed.questões ?? parsed.items ?? parsed.questions;
    if (Array.isArray(nestedList)) {
      arr = nestedList;
      const provaObj = (parsed.prova && typeof parsed.prova === 'object') ? parsed.prova : parsed;
      inheritedMeta = {
        banca: provaObj.banca ?? provaObj.concurso ?? provaObj.orgao ?? provaObj.órgão ?? '',
        ano: provaObj.ano ?? '',
        materia: provaObj.materia ?? provaObj.matéria ?? provaObj.disciplina ?? '',
        fase: provaObj.fase ?? ''
      };
    } else {
      arr = [parsed];
    }
  } else {
    return { valid: [], errors: ['Formato JSON não reconhecido.'], totalBlocks: 0 };
  }

  const valid = [];
  const errors = [];
  arr.forEach((item, idx) => {
    const res = sanitizeQuestion(item, nextQuestionId() + valid.length, inheritedMeta);
    if (res.error) errors.push(`Item #${idx + 1}: ${res.error}`);
    else valid.push(res.question);
  });
  return { valid, errors, totalBlocks: arr.length };
}

function syncImportBuffers() {
  if (QBuilder.mode === 'single') syncDraftFromForm();
  const bulkEl = $('#bulkInput');
  const jsonEl = $('#jsonInput');
  if (bulkEl) QBuilder.bulkText = bulkEl.value;
  if (jsonEl) QBuilder.jsonText = jsonEl.value;
}

function handleSingleAdd(form) {
  syncDraftFromForm();
  const d = QBuilder.draft;
  const candidate = {
    banca: d.banca,
    ano: d.ano,
    materia: d.materia,
    assunto: d.assunto,
    enunciado: d.enunciado,
    imagem: d.imagem,
    imagemPos: d.imagemPos,
    alternativas: { A: d.A, B: d.B, C: d.C, D: d.D, E: d.E },
    gabarito: d.gabarito,
    resolucao: d.resolucao
  };
  const check = sanitizeQuestion(candidate, nextQuestionId());
  if (check.error) {
    QBuilder.report = { added: 0, totalBlocks: 1, errors: [check.error] };
    renderAddQuestions();
    return toast(esc(check.error), 'bad');
  }
  const added = addQuestionsToBank([check.question]);
  QBuilder.draft = {
    banca: candidate.banca, ano: candidate.ano, materia: candidate.materia, assunto: '',
    enunciado: '', imagem: '', imagemPos: 'enunciado',
    A: '', B: '', C: '', D: '', E: '', gabarito: 'C', resolucao: ''
  };
  QBuilder.report = { added, totalBlocks: 1, errors: [] };
  applyFilters();
  render();
  renderAddQuestions();
  toast(`✅ ${added} questão adicionada ao banco!`, 'good');
}

function handleBulkImport() {
  syncImportBuffers();
  const parsed = parseStructuredText(QBuilder.bulkText);
  const added = addQuestionsToBank(parsed.valid);
  QBuilder.report = { added, totalBlocks: parsed.totalBlocks, errors: parsed.errors };
  if (added > 0) {
    QBuilder.bulkText = '';
    applyFilters();
    render();
    toast(`✅ ${added} questão(ões) importada(s)!`, 'good');
  } else {
    toast('Nenhuma questão válida encontrada', 'bad');
  }
  renderAddQuestions();
}

function handleJsonImport() {
  syncImportBuffers();
  const parsed = parseJsonQuestions(QBuilder.jsonText);
  const added = addQuestionsToBank(parsed.valid);
  QBuilder.report = { added, totalBlocks: parsed.totalBlocks, errors: parsed.errors };
  if (added > 0) {
    QBuilder.jsonText = '';
    applyFilters();
    render();
    toast(`✅ ${added} questão(ões) importada(s) via JSON!`, 'good');
  } else {
    toast('Erro ao importar JSON', 'bad');
  }
  renderAddQuestions();
}

function exportBankJson() {
  const payload = JSON.stringify(QUESTIONS, null, 2);
  copyText(payload);
  try {
    const blob = new Blob([payload], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'radiano-questoes.json';
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  } catch (e) {}
}

async function clearCustomQuestions() {
  if (!(await askConfirm(`Remover todas as ${customQuestions.length} questões adicionadas por você? As questões base permanecem.`, 'Remover'))) return;
  lsDel(CUSTOM_Q_KEY);
  rebuildQuestionsBank();
  QBuilder.report = null;
  applyFilters();
  render();
  renderAddQuestions();
  toast('Questões personalizadas removidas', 'bad');
}

function chip(group, value, active) {
  const on = 'bg-indigo-600 text-white border-indigo-600 shadow shadow-indigo-500/30';
  const off = 'bg-slate-50 dark:bg-slate-800 text-slate-700 dark:text-slate-300 border-slate-200 dark:border-slate-700 hover:border-indigo-400';
  return `<button data-filter="${group}" data-value="${value}" class="px-3 py-1.5 rounded-lg border text-sm font-medium transition ${active ? on : off}">${value}</button>`;
}
function renderFilters() {
  $('#fConcurso').innerHTML = CONCURSOS.map(c => chip('concurso', c, state.concurso === c)).join('');
  $('#fAno').innerHTML      = availableYears().map(y => chip('ano', y, String(state.ano) === String(y))).join('');
  $('#fMateria').innerHTML  = MATERIAS.map(m => chip('materia', m, state.materia === m)).join('');

  const searchEl = $('#fAssuntoSearch');
  if (searchEl && searchEl.value !== state.assuntoQuery) {
    searchEl.value = state.assuntoQuery;
  }
  const assuntos = availableAssuntos();
  $('#fAssunto').innerHTML = assuntos.length > 1
    ? assuntos.map(a => chip('assunto', a, state.assunto === a)).join('')
    : '<span class="text-xs text-slate-500 dark:text-slate-400">Nenhum assunto encontrado.</span>';

  $('#fStatus').innerHTML = STATUS.map(s => {
    const act = state.status === s.k;
    return `<button data-filter="status" data-value="${s.k}" class="px-1 py-2 rounded-lg text-xs font-semibold transition ${act ? 'bg-white dark:bg-slate-950 shadow text-indigo-600 dark:text-indigo-300' : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white'}">${s.l}</button>`;
  }).join('');
}
function renderNav() {
  $('#listCount').textContent = `${state.list.length} questão(ões)`;
  $('#navPills').innerHTML = state.list.length
    ? state.list.map((id, i) => {
        const p = db.progress[id];
        let c = 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-700';
        if (p) c = p.correct ? 'bg-emerald-500/15 text-emerald-600 dark:text-emerald-300 border-emerald-500/40' : 'bg-rose-500/15 text-rose-600 dark:text-rose-300 border-rose-500/40';
        const cur = i === state.idx ? 'ring-2 ring-indigo-500' : '';
        return `<button data-nav="${i}" class="h-9 w-9 rounded-lg border text-sm font-bold transition hover:scale-105 ${c} ${cur}">${i + 1}</button>`;
      }).join('')
    : '<span class="text-sm text-slate-500">—</span>';

  const st = statsFrom(db.progress);
  $('#stDone').textContent = st.solved;
  $('#stHit').textContent = st.hits;
  $('#stRate').textContent = st.solved ? Math.round((st.hits / st.solved) * 100) + '%' : '0%';
}

function optionClass(q, letter, answered, p) {
  const base = 'group flex items-stretch rounded-xl border transition';
  if (answered) {
    if (letter === q.gabarito) return `${base} border-emerald-500 bg-emerald-500/10`;
    if (letter === p.chosen && !p.correct) return `${base} border-rose-500 bg-rose-500/10`;
    return `${base} border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 opacity-60`;
  }
  if (state.selected === letter) return `${base} border-indigo-500 bg-indigo-500/10 ring-2 ring-indigo-500/30`;
  return `${base} border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 hover:border-indigo-400`;
}
function letterBadge(q, letter, answered, p) {
  let c = 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300';
  if (answered && letter === q.gabarito) c = 'bg-emerald-500 text-white';
  else if (answered && letter === p.chosen && !p.correct) c = 'bg-rose-500 text-white';
  else if (!answered && state.selected === letter) c = 'bg-indigo-600 text-white';
  return `<span class="h-8 w-8 shrink-0 grid place-items-center rounded-full text-sm font-bold ${c}">${letter}</span>`;
}

/* =====================================================================
   VIEW: AMIGOS & RANKING
   ===================================================================== */
function subjectBars(subjects) {
  const rows = Object.entries(subjects || {}).map(([m, v]) => ({ m, ...v, t: v.hit + v.err })).filter(r => r.t > 0).sort((a, b) => b.t - a.t);
  if (!rows.length) return '<p class="text-sm text-slate-500 dark:text-slate-400">Ainda sem questões resolvidas.</p>';
  return rows.map(r => {
    const pct = Math.round((r.hit / r.t) * 100);
    return `<div>
      <div class="flex justify-between text-sm mb-1"><span class="font-semibold">${esc(r.m)}</span>
        <span class="text-xs text-slate-500 dark:text-slate-400">${r.hit} acertos · ${r.err} erros · ${pct}%</span></div>
      <div class="h-2 rounded-full bg-rose-500/30 overflow-hidden"><div class="h-full bg-emerald-500" style="width:${pct}%"></div></div>
    </div>`;
  }).join('');
}
function strongWeak(subjects) {
  const rows = Object.entries(subjects || {}).map(([m, v]) => ({ m, t: v.hit + v.err, pct: v.hit / (v.hit + v.err || 1) })).filter(r => r.t > 0);
  if (!rows.length) return '';
  rows.sort((a, b) => b.pct - a.pct || b.t - a.t);
  const strong = rows[0], weak = rows[rows.length - 1];

async function addFriend(q) {

  q = (q || '').trim(); if (!q) return;
  F.query = q;
  let res;
  try { res = await social().add(q); } catch (e) { res = { error: (e && e.message) || 'Falha ao adicionar.' }; }
  if (res.error) { F.addError = res.error; renderFriends(); return; }
  F.addError = null; F.query = '';
  try { F.list = await social().list(); } catch (e) {}
  F.selected = res.profile.id;
  renderFriends();
  toast(`🤝 ${esc(res.profile.name)} adicionado!`, 'good');
}

  const p = F.list.find(x => x.id === id);
  if (!(await askConfirm(`Remover ${p ? p.name : 'este amigo'} da sua lista?`, 'Remover'))) return;
  try { await social().remove(id); F.list = await social().list(); } catch (e) { toast('Falha ao remover', 'bad'); return; }
  F.selected = null; renderFriends(); toast('Amigo removido', 'bad');
}

          ? 'Autenticação via <strong>Supabase Auth</strong> ativa. O progresso é sincronizado com a tabela <code>profiles</code>.'
          : 'O Supabase <strong>não está configurado</strong>, então o app roda em modo demonstração (localStorage). Para ativar contas reais, preencha <code>SUPABASE_URL</code> e <code>SUPABASE_ANON_KEY</code> no início do script — a interface continua igual.'}</p>
        <button data-act="resetProgress" class="mt-4 text-sm text-rose-500 hover:underline flex items-center gap-1.5"><i data-lucide="trash-2" class="h-4 w-4"></i> Zerar meu progresso (XP, ofensiva e questões)</button>
      </div>
    </div>`;
  icons();
}

/* =====================================================================
   MODAL DE CONTA
   ===================================================================== */
function setAuthTab(tab) {
  authTab = tab;
  const up = tab === 'signup';
  $('#signupFields').classList.toggle('hidden', !up);
  $('#authTitle').textContent = up ? 'Criar conta' : 'Entrar';
  $('#authSubmit').textContent = up ? 'Criar conta' : 'Entrar';
  $('#authSub').textContent = up ? 'Salve seu progresso e entre no ranking dos amigos.' : 'Bem-vindo de volta, cadete!';
  $('#authForm').elements.password.autocomplete = up ? 'new-password' : 'current-password';
  $$('[data-authtab]').forEach(b => {
    const on = b.dataset.authtab === tab;
    b.className = 'py-2 rounded-lg text-sm font-semibold transition ' + (on ? 'bg-white dark:bg-slate-950 shadow text-indigo-600 dark:text-indigo-300' : 'text-slate-600 dark:text-slate-400');
  });
  authMsg('', '');
}
function authMsg(err, info) {
  const e = $('#authError'), i = $('#authInfo');
  e.textContent = err; e.classList.toggle('hidden', !err);
  i.textContent = info; i.classList.toggle('hidden', !info);
}
function openAuth(tab = 'signin') {
  $('#authModeNote').innerHTML = USE_SUPABASE
    ? 'Autenticação por <strong>Supabase Auth</strong>.'
    : '<strong>Modo demonstração:</strong> a conta e a senha ficam salvas apenas no localStorage deste navegador (senha com hash SHA-256). Não use uma senha real. Preencha <code>SUPABASE_URL</code> e <code>SUPABASE_ANON_KEY</code> no código para ativar contas de verdade.';
  setAuthTab(tab);
  const m = $('#authModal'); m.classList.remove('hidden'); m.classList.add('flex');
  icons();
  setTimeout(() => { const f = $('#authForm').elements[tab === 'signup' ? 'name' : 'email']; if (f) f.focus(); }, 50);
}
function closeAuth() { const m = $('#authModal'); m.classList.add('hidden'); m.classList.remove('flex'); $('#authForm').reset(); authMsg('', ''); }
const authOpen = () => !$('#authModal').classList.contains('hidden');

let confirmResolve = null;
const confirmOpen = () => !$('#confirmModal').classList.contains('hidden');
function askConfirm(msg, okLabel = 'Confirmar') {
  return new Promise(resolve => {
    if (confirmResolve) confirmResolve(false);
    confirmResolve = resolve;
    $('#confirmMsg').innerHTML = esc(msg).replace(/\n/g, '<br>');
    $('#confirmYes').textContent = okLabel;
    const m = $('#confirmModal'); m.classList.remove('hidden'); m.classList.add('flex');
  });
}
function closeConfirm(value) {
  const m = $('#confirmModal'); m.classList.add('hidden'); m.classList.remove('flex');
  const r = confirmResolve; confirmResolve = null;
  if (r) r(value);
}
async function resetProgress() {
  if (!(await askConfirm('Zerar XP, ofensiva e progresso das questões? (Seus amigos e conta são mantidos.)', 'Zerar'))) return;
  db = { ...freshData(), friends: db.friends };
  state.struck = {}; state.retry = {};
  saveDB(); applyFilters(); updateHeader(); render(); renderProfile();
  toast('Progresso zerado', 'bad');
}

async function runForm(form) {
  if (!form) return;
  const kind = form.dataset.form;
  if (kind === 'auth') return submitAuth(form);
  if (kind === 'addFriend') return addFriend(new FormData(form).get('q'));
  if (kind === 'addSingle') return handleSingleAdd(form);
  if (kind === 'profileEdit') {
    const fd = new FormData(form);
    try {
      account = await Auth.updateProfile(account, { name: fd.get('name'), handle: fd.get('handle') });
      P.editing = false; P.error = null;
      scheduleCloudPush(); updateHeader(); renderProfile(); toast('Perfil atualizado', 'good');
    } catch (err) { P.error = err.message; renderProfile(); }
  }
}

async function submitAuth(form) {
  if (authBusy) return;
  const fd = new FormData(form);
  const v = { email: fd.get('email'), password: fd.get('password'), name: fd.get('name'), handle: fd.get('handle') };
  authBusy = true; $('#authSubmit').disabled = true; authMsg('', '');
  try {
    const res = authTab === 'signup' ? await Auth.signUp(v) : await Auth.signIn(v);
    if (res.needsConfirm) { authMsg('', 'Conta criada! Confirme seu e-mail pelo link que enviamos e depois entre.'); setAuthTab('signin'); $('#authInfo').textContent = 'Conta criada! Confirme seu e-mail pelo link que enviamos e depois entre.'; $('#authInfo').classList.remove('hidden'); return; }
    await enterAccount(res.account);
    closeAuth();
    toast(authTab === 'signup' ? `🎖️ Conta criada! Olá, ${esc(res.account.name)}` : `👋 Bem-vindo, ${esc(res.account.name)}`, 'good');
    if (migratedFromGuest) { migratedFromGuest = false; setTimeout(() => toast('Seu progresso de visitante foi transferido para a conta', 'level'), 600); }
  } catch (e) {
    authMsg((e && e.message) || 'Não foi possível concluir.', '');
  } finally { authBusy = false; $('#authSubmit').disabled = false; }
}

async function enterAccount(acc) {
  account = acc;
  db = bootstrapData(acc.id);
  await cloudPull();
  afterIdentityChange();
}
async function signOut() {
  try { await Auth.signOut(); } catch (e) {}
  account = null;
  db = bootstrapData('guest');
  afterIdentityChange();
  toast('Você saiu da conta', 'bad');
}
function afterIdentityChange() {
  state.struck = {}; state.retry = {};
  F.list = []; F.selected = null; F.addError = null; F.query = ''; P.editing = false; P.error = null;
  applyFilters(); updateHeader(); render();
  if (route === 'amigos') loadFriends();
  if (route === 'perfil') renderProfile();
}

/* =====================================================================
   ROTAS
   ===================================================================== */
const ROUTES = ['questoes', 'adicionar', 'amigos', 'perfil'];
function setRoute(r, push = true) {
  if (!ROUTES.includes(r)) r = 'questoes';
  route = r;
  ROUTES.forEach(x => $('#view-' + x).classList.toggle('hidden', x !== r));
  $$('[data-route]').forEach(b => { b.dataset.active = String(b.dataset.route === r); });
  $('#kbHint').classList.toggle('hidden', r !== 'questoes');
  if (push && location.hash !== '#/' + r) location.hash = '#/' + r;
  if (r === 'questoes') { renderQuestion(); }
  if (r === 'adicionar') { renderAddQuestions(); }
  if (r === 'amigos') loadFriends();
  if (r === 'perfil') renderProfile();
  window.scrollTo(0, 0);
}

/* =====================================================================
   AÇÕES — questões
   ===================================================================== */
function selectOption(letter) {
  const q = currentQ();
  if (!q || isAnswered(q)) return;
  if ((state.struck[q.id] || []).includes(letter)) return;
  state.selected = letter;
  renderQuestion();
}
function toggleStrike(letter) {
  const q = currentQ();
  if (!q || isAnswered(q)) return;
  const arr = state.struck[q.id] = state.struck[q.id] || [];
  const i = arr.indexOf(letter);
  if (i >= 0) arr.splice(i, 1);
  else { arr.push(letter); if (state.selected === letter) state.selected = null; }
  renderQuestion();
}
function answer() {
  const q = currentQ();
  if (!q || !state.selected || isAnswered(q)) return;

  const correct = state.selected === q.gabarito;
  const first = !db.progress[q.id];
  const rankBefore = rankInfo(db.xp).cur.name;
  let gained = first ? 0 : (db.progress[q.id].gained || 0);

  if (first) { gained = correct ? 10 : 2; db.xp += gained; }
  db.progress[q.id] = { chosen: state.selected, correct, gained, at: Date.now() };
  db.log.push({ qid: q.id, correct, at: Date.now() });
  if (db.log.length > 60) db.log = db.log.slice(-60);
  delete state.retry[q.id];

  let streakUp = false;
  if (correct) streakUp = registerHitToday();
  saveDB();

  updateHeader(true);
  render();

  if (first) toast(correct ? `✅ Acertou! +${gained} XP` : `💪 +${gained} XP pelo esforço`, correct ? 'good' : 'bad');
  else toast(correct ? 'Acertou no treino extra (sem XP)' : 'Errou no treino extra (sem XP)', 'bad');
  if (streakUp) setTimeout(() => toast(`🔥 Ofensiva: ${db.streak.count} dia(s)!`, 'fire'), 500);
  const rankAfter = rankInfo(db.xp).cur.name;
  if (rankAfter !== rankBefore) setTimeout(() => toast(`🎖️ Nova patente: ${rankAfter}!`, 'level'), 1000);
}
function go(delta) {
  const n = state.idx + delta;
  if (n < 0 || n >= state.list.length) return;
  state.idx = n; state.selected = null;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function retry() {
  const q = currentQ(); if (!q) return;
  state.retry[q.id] = true; state.selected = null; state.struck[q.id] = [];
  renderQuestion();
}
function setFilter(group, value) { state[group] = value; applyFilters(); render(); }

/* =====================================================================
   EVENTOS
   ===================================================================== */
document.addEventListener('input', e => {
  if (e.target && e.target.id === 'fAssuntoSearch') {
    state.assuntoQuery = e.target.value;
    if (state.assunto !== 'Todos' && !String(state.assunto).toLowerCase().includes(state.assuntoQuery.trim().toLowerCase())) {
      state.assunto = 'Todos';
    }
    applyFilters();
    const assuntos = availableAssuntos();
    $('#fAssunto').innerHTML = assuntos.length > 1
      ? assuntos.map(a => chip('assunto', a, state.assunto === a)).join('')
      : '<span class="text-xs text-slate-500 dark:text-slate-400">Nenhum assunto encontrado.</span>';
    renderNav();
    renderQuestion();
  }
  if (e.target && e.target.id === 'qManageSearch') {
    QBuilder.manageSearch = e.target.value;
    const box = $('#manageQuestionsBox');
    if (box) {
      const selStart = e.target.selectionStart;
      const selEnd = e.target.selectionEnd;
      box.outerHTML = renderManageQuestionsSection();
      typeset($('#manageQuestionsBox'));
      icons();
      const inputNow = $('#qManageSearch');
      if (inputNow) {
        inputNow.focus();
        try { inputNow.setSelectionRange(selStart, selEnd); } catch (err) {}
      }
    }
  }
});

document.addEventListener('change', e => {
  if (e.target && e.target.id === 'qImgFile') {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    if (file.size > 1.5 * 1024 * 1024) {
      e.target.value = '';
      return toast('Imagem grande demais (use até ~1,5 MB)', 'bad');
    }
    syncDraftFromForm();
    const reader = new FileReader();
    reader.onload = () => {
      QBuilder.draft.imagem = String(reader.result || '');
      renderAddQuestions();
      toast('Imagem anexada à questão', 'good');
    };
    reader.readAsDataURL(file);
  }
  if (e.target && e.target.id === 'qImgPos') {
    QBuilder.draft.imagemPos = e.target.value;
  }
});

document.addEventListener('click', e => {
  const rt = e.target.closest('[data-route]');
  if (rt) return setRoute(rt.dataset.route);

  const qm = e.target.closest('[data-qmode]');
  if (qm) {
    syncImportBuffers();
    QBuilder.mode = qm.dataset.qmode;
    QBuilder.report = null;
    return renderAddQuestions();
  }

  const qmf = e.target.closest('[data-qmanagefilter]');
  if (qmf) {
    QBuilder.manageFilter = qmf.dataset.qmanagefilter;
    return renderAddQuestions();
  }

  const cp = e.target.closest('[data-copy]');
  if (cp) return copyText(cp.dataset.copy);

  const at = e.target.closest('[data-authtab]');
  if (at) return setAuthTab(at.dataset.authtab);

  if (e.target === $('#confirmModal')) return closeConfirm(false);
  if (e.target === $('#authModal')) return closeAuth();

  const fr = e.target.closest('[data-friend]');
  if (fr) {
    F.selected = fr.dataset.friend; renderFriends();
    if (window.innerWidth < 1024) $('#friendDetail').scrollIntoView({ behavior: 'smooth', block: 'start' });
    return;
  }
  const so = e.target.closest('[data-sort]');
  if (so) { F.sort = so.dataset.sort; return renderFriends(); }

  const f = e.target.closest('[data-filter]');
  if (f) return setFilter(f.dataset.filter, f.dataset.value);

  const n = e.target.closest('[data-nav]');
  if (n) { state.idx = +n.dataset.nav; state.selected = null; render(); return; }

  const a = e.target.closest('[data-act]');
  if (!a || a.disabled) return;
  switch (a.dataset.act) {
    case 'select': selectOption(a.dataset.letter); break;
    case 'strike': toggleStrike(a.dataset.letter); break;
    case 'answer': answer(); break;
    case 'next': go(1); break;
    case 'prev': go(-1); break;
    case 'retry': retry(); break;
    case 'clearAssunto': state.assunto = 'Todos'; state.assuntoQuery = ''; applyFilters(); render(); break;
    case 'clear': state.concurso = 'Todos'; state.ano = 'Todos'; state.materia = 'Todas'; state.assunto = 'Todos'; state.assuntoQuery = ''; state.status = 'todas'; applyFilters(); render(); break;
    case 'account': account ? setRoute('perfil') : openAuth('signin'); break;
    case 'openAuth': openAuth(a.dataset.tab || 'signin'); break;
    case 'closeAuth': closeAuth(); break;
    case 'signOut': signOut(); break;
    case 'editProfile': P.editing = true; P.error = null; renderProfile(); break;
    case 'cancelEdit': P.editing = false; P.error = null; renderProfile(); break;
    case 'regenCode':
      Auth.regenCode(account).then(acc => { account = acc; updateHeader(); renderProfile(); toast('Novo código: ' + esc(acc.code), 'good'); })
        .catch(err => { P.error = err.message; renderProfile(); });
      break;
    case 'removeFriend': removeFriend(a.dataset.id); break;
    case 'resetProgress': resetProgress(); break;
    case 'submitForm': runForm(a.closest('form[data-form]')); break;
    case 'confirmYes': closeConfirm(true); break;
    case 'confirmNo': closeConfirm(false); break;
    case 'removeDraftImg':
      syncDraftFromForm();
      QBuilder.draft.imagem = '';
      renderAddQuestions();
      break;
    case 'fillBulkSample': QBuilder.bulkText = SAMPLE_BULK; QBuilder.report = null; renderAddQuestions(); break;
    case 'fillJsonSample': QBuilder.jsonText = SAMPLE_JSON; QBuilder.report = null; renderAddQuestions(); break;
    case 'clearImportBox':
      if (QBuilder.mode === 'bulk') QBuilder.bulkText = '';
      else QBuilder.jsonText = '';
      QBuilder.report = null;
      renderAddQuestions();
      break;
    case 'clearDraft':
      QBuilder.draft = {
        banca: 'EFOMM', ano: 2025, materia: 'Matemática', assunto: '',
        enunciado: '', imagem: '', imagemPos: 'enunciado',
        A: '', B: '', C: '', D: '', E: '', gabarito: 'C', resolucao: ''
      };
      QBuilder.report = null;
      renderAddQuestions();
      break;
    case 'runBulkImport': handleBulkImport(); break;
    case 'runJsonImport': handleJsonImport(); break;
    case 'exportJson': exportBankJson(); break;
    case 'clearCustomQuestions': clearCustomQuestions(); break;
    case 'deleteQuestion': deleteQuestionById(a.dataset.qid); break;
  }
});

document.addEventListener('contextmenu', e => {
  const opt = e.target.closest('[data-option]');
  if (!opt || route !== 'questoes') return;
  e.preventDefault();
  toggleStrike(opt.dataset.option);
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (confirmOpen()) return closeConfirm(false); if (authOpen()) return closeAuth(); }
  if (e.key === 'Enter' && e.target.tagName === 'INPUT') {
    const form = e.target.closest('form[data-form]');
    if (form) { e.preventDefault(); runForm(form); return; }
  }
  if (route !== 'questoes' || authOpen() || confirmOpen()) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (/^(INPUT|TEXTAREA|SELECT)$/.test((e.target.tagName || ''))) return;
  const q = currentQ();
  if (!q) return;
  const k = e.key.toLowerCase();
  if (k.length === 1 && 'abcde'.includes(k)) selectOption(k.toUpperCase());
  else if (e.key === 'Enter' && e.target === document.body) { isAnswered(q) ? go(1) : answer(); }
  else if (e.key === 'ArrowRight') go(1);
  else if (e.key === 'ArrowLeft') go(-1);
});

window.addEventListener('hashchange', () => {
  const r = location.hash.replace('#/', '');
  if (r !== route) setRoute(r, false);
});

$('#themeBtn').addEventListener('click', () => {
  const dark = document.documentElement.classList.toggle('dark');
  lsSet(THEME_KEY, dark ? 'dark' : 'light');
});
$('#filtersToggle').addEventListener('click', () => $('#filtersPanel').classList.toggle('hidden'));

/* =====================================================================
   INICIALIZAÇÃO
   ===================================================================== */
window.addEventListener('DOMContentLoaded', async () => {
  rebuildQuestionsBank();

  if (!lsGet(DATA_PREFIX + 'guest')) {
    const v1 = lsGet('radiano:v1');
    if (v1 && typeof v1 === 'object') lsSet(DATA_PREFIX + 'guest', normData({ xp: v1.xp, streak: v1.streak, progress: v1.progress }));
  }

  let acc = null;
  try { acc = await Auth.restore(); } catch (e) { console.warn('Sessão não restaurada:', e); }
  if (acc) { account = acc; db = bootstrapData(acc.id); await cloudPull(); }
  else { account = null; db = bootstrapData('guest'); }

  if (USE_SUPABASE) {
    sbClient.auth.onAuthStateChange(evt => {
      if (evt === 'SIGNED_OUT' && account) { account = null; db = bootstrapData('guest'); afterIdentityChange(); }
    });
  }

  applyFilters();
  updateHeader();
  render();
  const r = location.hash.replace('#/', '');
  setRoute(ROUTES.includes(r) ? r : 'questoes', false);
  window.addEventListener('load', () => { typeset($('#qArea')); icons(); });
});
</script>
